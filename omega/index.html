n In</button></nav></section><div class="drawer-bottom">OMEGA / SHELL</div></aside><div id="notice" role="status" hidden></div><script>
const screen=document.querySelector('.screen'),viewport=document.querySelector('#viewport');function fit(){let mobile=innerWidth<=720,w=mobile?390:1440,h=mobile?844:900,s=Math.min(innerWidth/w,mobile?2:1.25);screen.style.transform=`scale(${s})`;viewport.style.width=w*s+'px';viewport.style.height=Math.max(h*s,innerHeight)+'px'}addEventListener('resize',fit);fit();
const drawer=document.querySelector('.drawer'),backdrop=document.querySelector('.backdrop'),toggle=document.querySelector('.hamburger'),input=document.querySelector('input');function menu(open){drawer.hidden=backdrop.hidden=!open;toggle.setAttribute('aria-expanded',String(open));document.body.style.overflow=open?'hidden':'';if(open)document.querySelector('.close').focus();else toggle.focus()}toggle.onclick=()=>menu(true);document.querySelector('.close').onclick=()=>menu(false);backdrop.onclick=()=>menu(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')menu(false);if(e.key==='Tab'&&!drawer.hidden){let b=[...drawer.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===b[0]){e.preventDefault();b.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===b.at(-1)){e.preventDefault();b[0].focus()}}});let timer;function notice(text){let n=document.querySelector('#notice');n.textContent=text;n.hidden=false;clearTimeout(timer);timer=setTimeout(()=>n.hidden=true,4000)}
let active='';const angles={phi:-90,pi:0,tau:180,psi:90},names={phi:'Ω·Φ',pi:'Ω·Π',tau:'Ω·Τ',psi:'Ω·Ψ'};document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>{let id=b.dataset.product;active=id;document.querySelectorAll('.product').forEach(n=>n.classList.toggle('selected',n.dataset.product===id));document.querySelectorAll('.active-arc').forEach(a=>a.style.transform=`rotate(${angles[id]}deg)`);input.placeholder=`Ask ${names[id]}...`;if(!drawer.hidden)menu(false)});document.querySelector('.core').onclick=()=>{active='';document.querySelectorAll('.product').forEach(n=>n.classList.remove('selected'));document.querySelectorAll('.active-arc').forEach(a=>a.style.transform='rotate(0deg)');input.placeholder='Ask Omega...';input.focus()};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='New Conversation'){input.value='';document.querySelector('.core').click();menu(false)}else notice(a+' is not connected yet.')});document.querySelector('.prompt').onsubmit=e=>{e.preventDefault();if(input.value.trim())notice('The Omega agent is not connected yet.')};document.querySelectorAll('.wallet').forEach(b=>b.onclick=async()=>{if(!window.ethereum){notice('Open this page in a wallet browser to connect.');return}try{const accounts=await window.ethereum.request({method:'eth_requestAccounts'});if(accounts[0]){const s=accounts[0].slice(0,6)+'…'+accounts[0].slice(-4);document.querySelectorAll('.wallet').forEach(w=>{w.setAttribute('aria-label',s);let label=w.querySelector('span');if(label)label.textContent=s;else if(!w.querySelector('svg'))w.textContent=s})}}catch(e){notice('Wallet connection was not completed.')}});
