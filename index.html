<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="وب‌سایت شخصی سهیل نیک‌زاد؛ معمار سیستم، کارآفرین و سازنده محصول در حوزه بیت‌کوین، بلاکچین، هوش مصنوعی و زیرساخت اعتماد دیجیتال." />
  <meta name="theme-color" content="#17191c" />
  <meta property="og:title" content="Soheil Nikzad — Systems Architect & Product Builder" />
  <meta property="og:description" content="Bitcoin, Blockchain, AI and Digital Trust Infrastructure." />
  <meta property="og:type" content="website" />
  <title>سهیل نیک‌زاد | Soheil Nikzad</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="styles/01.css" />
  <link rel="stylesheet" href="styles/02.css" />
  <link rel="stylesheet" href="styles/03.css" />
  <link rel="stylesheet" href="styles/04.css" />
  <link rel="stylesheet" href="styles/timestamp.css" />
</head>
<body>
  <main id="loading" style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif">Loading…</main>
  <script>
    (async () => {
      const files = ['parts/body-01.html', 'parts/body-02.html', 'parts/body-03.html', 'parts/body-04.html', 'parts/body-05.html'];
      try {
        const fragments = await Promise.all(files.map(async (file) => {
          const response = await fetch(file);
          if (!response.ok) throw new Error(`${file}: ${response.status}`);
          return response.text();
        }));
        document.body.innerHTML = fragments.join('');
        const core = document.createElement('script');
        core.src = 'assets/timestamp-core.js';
        core.onload = () => {
          const script = document.createElement('script');
          script.src = 'script.js';
          document.body.appendChild(script);
        };
        document.body.appendChild(core);
      } catch (error) {
        document.getElementById('loading').textContent = 'The site could not be loaded.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
